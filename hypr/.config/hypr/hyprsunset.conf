# Daytime: restore the compositor's identity color matrix.
profile {
    time = 07:00
    identity = true
}

# Evening: reduce blue light until the daytime profile takes over again.
profile {
    time = 20:00
    temperature = 4000
}

# Night: apply a warmer color temperature until 07:00.
profile {
    time = 21:00
    temperature = 3000
}

# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# -----------------------------------------------------
# OMARCHY CORE DEFAULTS (DO NOT EDIT THESE PATHS)
# -----------------------------------------------------
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.local/state/omarchy/current/theme/hyprland.conf

# -----------------------------------------------------
# PERSONAL OVERRIDES
# (These run last and will overwrite Omarchy's defaults)
# -----------------------------------------------------

# Scripts and autostart
exec-once = ~/.config/hypr/scripts/set-monitor.sh

# Core Overrides
source = ~/.config/hypr/windows.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/envs.conf

# Custom Keybindings Overrides
source = ~/.config/hypr/bindings/bindings.conf
source = ~/.config/hypr/bindings/media.conf
source = ~/.config/hypr/bindings/monitors.conf
source = ~/.config/hypr/bindings/clipboard.conf
source = ~/.config/hypr/bindings/utils.conf
source = ~/.config/hypr/bindings/tiling.conf

# App-specific Overrides
source = ~/.config/hypr/apps/bitwarden.conf
source = ~/.config/hypr/apps/browser.conf
source = ~/.config/hypr/apps/jetbrains.conf
source = ~/.config/hypr/apps/localsend.conf
source = ~/.config/hypr/apps/pip.conf
source = ~/.config/hypr/apps/retroarch.conf
source = ~/.config/hypr/apps/steam.conf
source = ~/.config/hypr/apps/system.conf
source = ~/.config/hypr/apps/terminals.conf

# Omarchy Unbinds (Disable unwanted default shortcuts)
source = ~/.config/hypr/unbind-omarchy.conf

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
